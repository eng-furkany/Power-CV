function gsCall(fnName, args, onOk, onErr) {
  var runner = google.script.run
    .withSuccessHandler(function (result) {
      if (!result || result.error) { onErr && onErr((result && result.error) || 'Unknown error'); return; }
      onOk && onOk(result);
    })
    .withFailureHandler(function (err) { onErr && onErr(err && err.message ? err.message : String(err)); });
  runner[fnName].apply(runner, args || []);
}

// Kullanıcı talebi: bir sayıya birim EKLENECEKSE bu, Sheet başlığından
// gerçekten okunan birim olmalı (bkz. unitFor) — % gibi bir birim
// varsayılıp hardcode edilmez.
function appendUnit(valueStr, unit) {
  if (!unit) return valueStr;

}
function fmtDate(iso) {

  return d.toLocaleDateString('en-US');

function parseSearchTerms(str) {
  return String(str || '').split(',').map(function (s) { return _norm(s.trim()); }).filter(Boolean);
}
function rowSearchHay(r) {
  return _norm([r.pn, r.plant, r.product, r.projectType, r.statusPlanned, r.statusActual, r.comment].join(' '));
}
function rowMatchesTerms(r, terms) {
  if (!terms || !terms.length) return true;
  var hay = rowSearchHay(r);
  return terms.some(function (term) { return hay.indexOf(term) > -1; });
}

// --------------------------------------------------------------------------
// Dashboard agregasyonları — istemci tarafında, getParcaListesi()'nin aynı
// satır önbelleğinden (AppState.liste.rows) hesaplanır. Üstteki genel arama
// kutusu bu satırları önceden süzer, aşağıdaki her şey (KPI/pasta/çubuk/
// gruplu tablolar/risk tablosu) yalnız süzülmüş alt kümeyi görür.
// --------------------------------------------------------------------------

// Diameter × Plant ve Project Type × Product tabloları aynı çapraz tablo
// (pivot) desenini paylaşır: satır = birincil boyut, kolon = ikincil boyut
// (en büyük N + "Diğer"/Other), hücre = OI toplamı. En fazla bu kadar kolon
// açılır — kalanı tek bir "Diğer" kolonunda toplanır (bucketTop'la aynı
// savunmacı desen, çok fazla ince sütun okunmaz oluyor).
var GROUPED_PIVOT_MAX_COLS = 6;

// cellSums: "satırAnahtarı|kolonAnahtarı" -> toplam. rowTotals/colTotals:
// tek boyutlu toplamlar (sıralama ve en-büyük-N seçimi için).
function buildPivot(cellSums, rowTotals, colTotals) {
  var colEntries = Object.keys(colTotals).map(function (k) { return [k, colTotals[k]]; });
  colEntries.sort(function (a, b) { return b[1] - a[1]; });
  var cols = colEntries.slice(0, GROUPED_PIVOT_MAX_COLS).map(function (e) { return e[0]; });
  var otherCols = colEntries.slice(GROUPED_PIVOT_MAX_COLS);
  var hasOther = otherCols.length > 0;

  var rowKeys = Object.keys(rowTotals).sort(function (a, b) { return rowTotals[b] - rowTotals[a]; });
  return {
    cols: cols,
    hasOther: hasOther,
    rows: rowKeys.map(function (rk) {
      var cells = cols.map(function (c) { return cellSums[rk + '|' + c] || 0; });
      var otherSum = hasOther ? otherCols.reduce(function (s, e) { return s + (cellSums[rk + '|' + e[0]] || 0); }, 0) : 0;
      return { rowKey: rk, cells: cells, otherSum: otherSum, total: rowTotals[rk] };
    })
  };
}

function computeDashboardAggregates(rows) {
  var totalVolume = 0, totalEur = 0, launchedCount = 0, riskCount = 0;
  var plantCounts = {}, volByType = {}, oiByType = {}, productVolume = {};
  var covSum = 0, covCount = 0; // Coverage + ortalaması (KPI kartı için)
  var daCells = {}, daRowTotals = {}, daColTotals = {}; // Diameter (satır) × Plant (kolon)
  var tfCells = {}, tfRowTotals = {}, tfColTotals = {}; // Project Type (satır) × Product (kolon)
  var riskRows = [];

  rows.forEach(function (r) {
    totalVolume += Number(r.volume) || 0;
    totalEur += Number(r.eur) || 0;
    var isLaunched = /launched/i.test(String(r.statusPlanned || '')) && /launched/i.test(String(r.statusActual || ''));
    if (isLaunched) launchedCount++;
    if (r.riskLevel === 'risk' || r.riskLevel === 'gecikme') { riskCount++; riskRows.push(r); }

    var plantKey = String(r.plant || '—');
    plantCounts[plantKey] = (plantCounts[plantKey] || 0) + 1;
    var typeKey = String(r.projectType || '—');
    volByType[typeKey] = (volByType[typeKey] || 0) + (Number(r.volume) || 0);
    oiByType[typeKey] = (oiByType[typeKey] || 0) + (Number(r.oi) || 0);
    if (r.coveragePlus !== '' && r.coveragePlus != null) {
      covSum += Number(r.coveragePlus);
      covCount++;
    }
    var prodKey = String(r.product || '—');
    productVolume[prodKey] = (productVolume[prodKey] || 0) + (Number(r.volume) || 0);
    var oiVal = Number(r.oi) || 0;

    // C (Diameter) + A (Plant) bazında K (OI) toplamı — kullanıcı talebi:
    // Amiens/Bursa gibi Plant değerleri aynı Diameter satırında hizalı,
    // diğer Diameter değerleri de ayrı satırlarda görülebilsin.
    var diamKey = String(r.diameter == null ? '—' : r.diameter);
    var daKey = diamKey + '|' + plantKey;
    daCells[daKey] = (daCells[daKey] || 0) + oiVal;
    daRowTotals[diamKey] = (daRowTotals[diamKey] || 0) + oiVal;
    daColTotals[plantKey] = (daColTotals[plantKey] || 0) + oiVal;

    // B (Project Type) + F (Product) bazında K (OI) toplamı — baz Project
    // Type (satır), Product kolon (kullanıcı talebi: eski düz liste çok
    // satırlı/dağınıktı, aynı pivot deseniyle sadeleştirildi).
    var tfKey = typeKey + '|' + prodKey;
    tfCells[tfKey] = (tfCells[tfKey] || 0) + oiVal;
    tfRowTotals[typeKey] = (tfRowTotals[typeKey] || 0) + oiVal;
    tfColTotals[prodKey] = (tfColTotals[prodKey] || 0) + oiVal;
  });

  riskRows.sort(function (a, b) { return (a.riskLevel === 'risk' ? 0 : 1) - (b.riskLevel === 'risk' ? 0 : 1); });

  // Coverage + ortalaması — kullanıcı talebi: grafiğin İÇİNDE değil, KPI
  // şeridinde yüzde olarak gösterilsin (önceki turda grafiğe eklenen küçük
  // işaretçi kaldırıldı, bkz. drawOiByTypeChart).
  var covAvg = covCount ? (covSum / covCount) : null;

  return {
    kpis: { totalParts: rows.length, totalVolume: totalVolume, totalEur: totalEur, launchedCount: launchedCount, riskCount: riskCount, covAvg: covAvg },
    plantCounts: bucketTop(plantCounts, 8),
    volByType: volByType,
    oiByType: oiByType,
    productVolume: productVolume,
    groupedDA: buildPivot(daCells, daRowTotals, daColTotals),
    groupedTF: buildPivot(tfCells, tfRowTotals, tfColTotals),
    riskRows: riskRows.slice(0, 50)
  };
}

// Bir pasta grafiğinde çok fazla ince dilim okunmaz oluyor — en büyük (max-1)
// kategori aynen kalır, kalanı tek bir "Diğer" dilimde toplanır.
function bucketTop(counts, max) {
  var entries = Object.keys(counts).map(function (k) { return [k, counts[k]]; });
  entries.sort(function (a, b) { return b[1] - a[1]; });
  if (entries.length <= max) return counts;
  var out = {};
  entries.slice(0, max - 1).forEach(function (e) { out[e[0]] = e[1]; });
  var restSum = entries.slice(max - 1).reduce(function (s, e) { return s + e[1]; }, 0);
  out[t('otherBucket')] = restSum;
  return out;
}

// --------------------------------------------------------------------------
// Yıl filtresi — planYear/planQuarter sunucuda hesaplanır (Risk.gs
// computePlanYear_/computePlanQuarter_): Status "Q#/YYYY" ise oradan, aksi
// halde Launch Sheet tarihinden türer. Varsayılan yıl "Tümü" DEĞIL — bu
// yılın planı gelecek yılınkiyle karışmasın diye (kullanıcı talebi).
// --------------------------------------------------------------------------

function availableYears(rows) {
  var set = {};
  rows.forEach(function (r) { if (r.planYear) set[r.planYear] = true; });
  return Object.keys(set).map(Number).sort();
}
function defaultYear(years) {
  if (!years.length) return 'all';
  var current = new Date().getFullYear();
  return (years.indexOf(current) > -1) ? current : years[0];
}
// Planlanan OI (K kolonu) ile gerçekleşen OI'yi (X kolonu, oiActual —
// kullanıcı talebi) aynı çeyreklere göre kümülatif topluyor, ikisi
// arasındaki fark çizgi grafikte görülebilsin diye.
function computeQuarterlyOI(rows, year) {
  var qPlanned = [0, 0, 0, 0], qActual = [0, 0, 0, 0];
  rows.forEach(function (r) {
    if (r.planYear !== year || !r.planQuarter) return;
    qPlanned[r.planQuarter - 1] += Number(r.oi) || 0;
    qActual[r.planQuarter - 1] += Number(r.oiActual) || 0;
  });
  var plannedCumulative = [], actualCumulative = [], runP = 0, runA = 0;
  for (var i = 0; i < 4; i++) {
    runP += qPlanned[i]; plannedCumulative.push(runP);
    runA += qActual[i]; actualCumulative.push(runA);
  }
  // Kullanıcı talebi: henüz başlamamış (gelecek) çeyrekler gösterilmesin —
  // "Q4'te planlanan projeler henüz gerçekleşmediği için data yanıltıyor."
  // Bugünün tarihine göre seçili yıl için kaç çeyrek başlamış/geçmiş
  // olduğunu hesaplıyoruz; ondan sonrası (henüz gerçekleşmeyen çeyrekler)
  // grafikten VE başlıktaki Plan/Actual toplamlarından tamamen çıkarılıyor
  // — hem Plan hem Actual "bugüne kadar" aynı dönemi kıyaslasın diye
  // (önceki tasarım tüm yılın planını, henüz biten kısmi Actual'a karşı
  // gösteriyordu — bu da farkı yapay şekilde büyütüyordu).
  var now = new Date();
  var curYear = now.getFullYear();
  var curQuarter = Math.floor(now.getMonth() / 3) + 1;
  var visibleQuarters = (year < curYear) ? 4 : (year === curYear ? curQuarter : 0);
  return {
    plannedQuarterly: qPlanned, actualQuarterly: qActual,
    plannedCumulative: plannedCumulative, actualCumulative: actualCumulative,
    visibleQuarters: visibleQuarters
  };
}

function renderYearSegment(years, current) {
  var html = '<div class="seg-wrap" role="group" aria-label="' + escAttr(t('yearFilterLabel')) + '">';
  html += '<button class="seg-btn' + (current === 'all' ? ' active' : '') + '" data-year="all">' + t('yearAll') + '</button>';
  years.forEach(function (y) {
    html += '<button class="seg-btn' + (current === y ? ' active' : '') + '" data-year="' + y + '">' + y + '</button>';
  });
  html += '</div>';
  return html;
}

function renderDashboard() {
  var allRows = AppState.liste.rows || [];
  var years = availableYears(allRows);
  if (AppState.dashboard.year === null) AppState.dashboard.year = defaultYear(years);

  var terms = parseSearchTerms(AppState.dashboard.searchInput);
  var yearFilter = AppState.dashboard.year;
  var rows = allRows.filter(function (r) {
    if (yearFilter !== 'all' && r.planYear !== yearFilter) return false;
    return rowMatchesTerms(r, terms);
  });
  var agg = computeDashboardAggregates(rows);
  AppState.dashboard.agg = agg;

  var qYear = (yearFilter === 'all') ? defaultYear(years) : yearFilter;
  var qData = (qYear === 'all')
    ? { plannedQuarterly: [0, 0, 0, 0], actualQuarterly: [0, 0, 0, 0], plannedCumulative: [0, 0, 0, 0], actualCumulative: [0, 0, 0, 0] }
    : computeQuarterlyOI(rows, qYear);
  AppState.dashboard.qData = qData;
  AppState.dashboard.qYear = qYear;

  var riskTerms = parseSearchTerms(AppState.dashboard.riskSearch);
  var riskFiltered = agg.riskRows.filter(function (r) { return rowMatchesTerms(r, riskTerms); });

  var root = document.getElementById('dashboard-body');
  var html = '';

  html += '<div class="filter-bar">';
  if (years.length) html += renderYearSegment(years, yearFilter);
  html += '<div class="filter-group filter-search" style="flex:1 1 260px;">' +
    '<span class="filter-label">' + t('globalSearchLabel') + '</span>' +
    '<input class="fdr-search" id="dash-search" type="search" placeholder="' + escAttr(t('globalSearchPlaceholder')) + '" value="' + escAttr(AppState.dashboard.searchInput) + '" aria-label="' + escAttr(t('globalSearchLabel')) + '"></div>' +
    (terms.length ? '<button class="btn btn-outlined" id="dash-search-clear">' + icon('x', 13) + '<span class="btn-label">' + t('clearFilters') + '</span></button>' : '') +
    '</div>';

  var k = agg.kpis;
  html += '<div class="kpi-row">' +
    kpiCard(t('kpiTotalParts'), fmtNum(k.totalParts)) +
    kpiCard(t('kpiTotalVolume'), appendUnit(fmtNum(k.totalVolume), unitFor('volume'))) +
    kpiCard(t('kpiTotalEur'), fmtEur(k.totalEur)) +
    kpiCard(t('kpiLaunched'), fmtNum(k.launchedCount)) +
    kpiCard(t('kpiRisk'), fmtNum(k.riskCount), k.riskCount > 0) +
    kpiCard(t('kpiCoverage'), k.covAvg == null ? '—' : appendUnit(fmtNum(k.covAvg), unitFor('coveragePlus'))) +
    '</div>';

  // Kullanıcı talebi (tekrarlanan): bu grafik tam genişlikte çok yer
  // kaplıyordu — artık diğer dört grafikle birlikte chart-grid içinde,
  // aynı kare hücre boyutunda. Varsayılan kompakt (90px, eksensiz mini
  // görünüm); sağ üstteki düğmeyle isteyen büyütüp tam detaya (eksenler +
  // legend + Plan/Actual/Δ başlığı) geçebiliyor — büyüdüğünde de hücre
  // genişliği sabit kaldığı için kare oranını korur, sayfa genişliğine
  // taşmaz.
  var oiCardHtml = '';
  if (qYear !== 'all') {
    var oiExpanded = !!AppState.dashboard.oiExpanded;
    // Kullanıcı talebi: henüz gerçekleşmemiş (gelecek) çeyrekler grafikte
    // gösterilmiyor — Plan/Actual başlık toplamları da tüm yıl yerine
    // yalnız "bugüne kadar geçen" çeyrekleri kıyaslıyor (aksi halde 3
    // çeyreklik Actual, 4 çeyreklik tüm-yıl Plan'a karşı yapay bir fark
    // gösteriyordu).
    var vq = qData.visibleQuarters;
    var oiTitle = qYear + ' ' + t('quarterlyOiTitle') + (vq > 0 && vq < 4 ? ' (Q1–Q' + vq + ')' : '');
    if (oiExpanded) {
      var planTotal = vq > 0 ? qData.plannedCumulative[vq - 1] : 0;
      var actualTotal = vq > 0 ? qData.actualCumulative[vq - 1] : 0;
      var diff = actualTotal - planTotal;
      var diffStr = (diff > 0 ? '+' : '') + fmtEur(diff);
      oiTitle += ' — ' + t('oiPlannedLabel') + ' ' + fmtEur(planTotal) + ' · ' + t('oiActualLabel') + ' ' + fmtEur(actualTotal) + ' · ' + t('oiDiffLabel') + ' ' + diffStr;
    }
    oiCardHtml = '<div class="card">' +
      '<div class="chart-hd">' +
      '<h2 class="chart-title" style="margin-bottom:0;">' + oiTitle + '</h2>' +
      '<button class="chart-toggle-btn" id="oi-toggle" aria-label="' + escAttr(oiExpanded ? t('collapseChart') : t('expandChart')) + '" title="' + escAttr(oiExpanded ? t('collapseChart') : t('expandChart')) + '">' +
      icon(oiExpanded ? 'chevronUp' : 'chevronDown', 16) + '</button>' +
      '</div>' +
      '<div class="chart-canvas-wrap ' + (oiExpanded ? 'chart-canvas-wrap-tall' : 'chart-canvas-wrap-compact') + '"><canvas id="chart-quarterly"></canvas></div></div>';
  }

  html += '<div class="chart-grid">' +
    oiCardHtml +
    chartCardHtml('chart-plant', t('chartPlantTitle')) +
    chartCardHtml('chart-volbytype', t('chartVolByTypeTitle')) +
    chartCardHtml('chart-oibytype', t('chartOiByTypeTitle')) +
    chartCardHtml('chart-product', t('chartProductTitle')) +
    '</div>';

  html += pivotTableHtml(t('groupedDATitle'), sheetLabelFor('diameter', 'colDiameter'), agg.groupedDA);
  html += pivotTableHtml(t('groupedTFTitle'), sheetLabelFor('projectType', 'colProjectType'), agg.groupedTF);

  html += '<div class="card"><h2 class="chart-title">' + t('riskTableTitle') + '</h2>';
  if (agg.riskRows.length) {
    html += '<input class="fdr-search" id="dash-risk-search" type="search" placeholder="' + escAttr(t('riskLocalSearchPlaceholder')) + '" value="' + escAttr(AppState.dashboard.riskSearch) + '" style="margin-bottom:var(--space-md);max-width:320px;" aria-label="' + escAttr(t('riskLocalSearchPlaceholder')) + '">';
  }
  if (!agg.riskRows.length) {
    html += emptyStateHtml('checkCircle', t('riskTableEmptyTitle'), t('riskTableEmptySub'), '');
  } else if (!riskFiltered.length) {
    html += emptyStateHtml('search', t('listEmptyTitle'), t('listEmptySub'),
      '<button class="btn btn-outlined" id="dash-risk-search-clear">' + t('clearFilters') + '</button>');
  } else {
    html += '<div class="tbl-wrap"><table class="dt"><thead><tr>' +
      '<th>' + colLabel('pn') + '</th><th>' + colLabel('plant') + '</th><th>' + colLabel('product') + '</th>' +
      '<th>' + colLabel('projectType') + '</th>' +
      '<th class="cf-num">' + colLabel('volume') + '</th><th>' + colLabel('status') + '</th></tr></thead><tbody>';
    riskFiltered.forEach(function (r) {
      html += '<tr>' +
        '<td><button class="pn-link" data-open-pn="' + escAttr(r.pn) + '">' + escHtml(r.pn) + '</button>' +
        (r.comment ? '<span class="comment-flag" title="' + escAttr(r.comment) + '">' + icon('messageSquare', 14) + '</span>' : '') +
        '</td>' +
        '<td>' + escHtml(r.plant) + '</td><td>' + escHtml(r.product) + '</td>' +
        '<td>' + escHtml(r.projectType || '—') + '</td>' +
        '<td class="cf-num">' + fmtNum(r.volume) + '</td>' +
        '<td>' + riskChip(r.riskLevel, /launched/i.test(String(r.statusPlanned || '')) && /launched/i.test(String(r.statusActual || ''))) + '</td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  root.innerHTML = html;
  wireDashboardInteractions(riskFiltered);
  drawPieChart('chart-plant', 'plant', agg.plantCounts);
  drawVolByTypeChart(agg.volByType);
  drawOiByTypeChart(agg.oiByType);
  drawProductChart(agg.productVolume);
  if (qYear !== 'all') drawQuarterlyChart(qData, !oiExpanded);
}

function chartCardHtml(canvasId, title) {
  return '<div class="card"><h2 class="chart-title">' + title + '</h2>' +
    '<div class="chart-canvas-wrap"><canvas id="' + canvasId + '"></canvas></div></div>';
}

// Çapraz tablo (pivot) render'ı — Diameter×Plant ve Project Type×Product
// ikisi de aynı şekli kullanır: rowHeaderLabel birincil boyutun kolon
// başlığı, pivot.cols ikincil boyutun (en büyük N + varsa "Diğer") kolon
// başlıkları. Kullanıcı talebi: iki tablo da veri temiz/az yer kaplasın diye
// düz liste yerine bu tek çapraz-tablo desenini paylaşıyor.
function pivotTableHtml(title, rowHeaderLabel, pivot) {
  var html = '<div class="card" style="margin-bottom:var(--space-lg);"><h2 class="chart-title">' + title + '</h2>';
  if (!pivot.rows.length) {
    html += emptyStateHtml('search', t('listEmptyTitle'), t('listEmptySub'), '');
  } else {
    html += '<div class="tbl-wrap"><table class="dt"><thead><tr><th>' + rowHeaderLabel + '</th>';
    pivot.cols.forEach(function (c) { html += '<th class="cf-num">' + escHtml(c || '—') + '</th>'; });
    if (pivot.hasOther) html += '<th class="cf-num">' + t('otherBucket') + '</th>';
    html += '<th class="cf-num">' + t('colTotal') + '</th></tr></thead><tbody>';
    pivot.rows.forEach(function (row) {
      html += '<tr><td>' + escHtml(row.rowKey) + '</td>';
      row.cells.forEach(function (v) { html += '<td class="cf-num">' + (v ? fmtNum(v) : '—') + '</td>'; });
      if (pivot.hasOther) html += '<td class="cf-num">' + (row.otherSum ? fmtNum(row.otherSum) : '—') + '</td>';
      html += '<td class="cf-num" style="font-weight:700;">' + fmtNum(row.total) + '</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  return html;
}

function wireDashboardInteractions(riskFiltered) {
  var search = document.getElementById('dash-search');
  if (search) {
    search.addEventListener('input', function () {
      AppState.dashboard.searchInput = search.value;
      var pos = search.selectionStart;
      renderDashboard();
      var again = document.getElementById('dash-search');
      if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    });
  }
  var clearBtn = document.getElementById('dash-search-clear');
  if (clearBtn) clearBtn.addEventListener('click', function () { AppState.dashboard.searchInput = ''; renderDashboard(); });

  var riskSearch = document.getElementById('dash-risk-search');
  if (riskSearch) {
    riskSearch.addEventListener('input', function () {
      AppState.dashboard.riskSearch = riskSearch.value;
      var pos = riskSearch.selectionStart;
      renderDashboard();
      var again = document.getElementById('dash-risk-search');
      if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    });
  }
  var riskClearBtn = document.getElementById('dash-risk-search-clear');
  if (riskClearBtn) riskClearBtn.addEventListener('click', function () { AppState.dashboard.riskSearch = ''; renderDashboard(); });

  var oiToggle = document.getElementById('oi-toggle');
  if (oiToggle) {
    oiToggle.addEventListener('click', function () {
      AppState.dashboard.oiExpanded = !AppState.dashboard.oiExpanded;
      renderDashboard();
    });
  }

  document.querySelectorAll('#dashboard-body [data-year]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var y = btn.getAttribute('data-year');
      AppState.dashboard.year = (y === 'all') ? 'all' : Number(y);
      renderDashboard();
    });
  });

  document.querySelectorAll('#dashboard-body [data-open-pn]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      openDrawer(btn.getAttribute('data-open-pn'), riskFiltered.map(function (r) { return r.pn; }));
    });
  });
}

// Bir pasta/çubuk dilimine tıklamak üst genel arama kutusunu o değerle
// DOLDURUR ve sayfayı yerinde yeniden süzer — grafikler.md "grafik = filtre
// kontrolü" ilkesi, ama Liste'ye gitmek yerine Dashboard'un kendi üstünde.
function applyChartClickFilter(rawLabel) {
  if (rawLabel === t('otherBucket')) return; // "Diğer" birden çok değeri temsil ediyor, tıklanamaz
  AppState.dashboard.searchInput = rawLabel;
  renderDashboard();
  showToast(t('filterAppliedToast') + ': ' + rawLabel, 'info');
}

// --------------------------------------------------------------------------
// Grafikler — grafikler.md (Chart.js, sabit yükseklikli kap, PALETTE, onClick=filtre)
// --------------------------------------------------------------------------

var CHART_PALETTE = ['#0072ce', '#76ff03', '#f59e0b', '#8b5cf6', '#ef4444', '#041b3c', '#06b6d4', '#ec4899'];

// Koyu lacivert (#041b3c, --valeo-blue) koyu kart zemininde (--card-bg
// #1e293b) neredeyse görünmüyor — koyu temada canlı bir renkle değiştir.
// (Kullanıcı bulgusu: "dark temada yazılar/renkler soluk oluyor.")
function chartPalette() {
  var p = CHART_PALETTE.slice();
  if (AppState.darkMode) p[5] = '#facc15';
  return p;
}

function drawPieChart(canvasId, chartKey, counts) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var wrap = canvas.closest('.chart-canvas-wrap');
  var labels = Object.keys(counts || {});
  if (!labels.length) { showChartNoData(wrap, canvas); return; }
  showCanvas(wrap, canvas);
  var values = labels.map(function (l) { return counts[l]; });
  var total = values.reduce(function (a, b) { return a + b; }, 0);
  var palette = chartPalette();
  var colors = labels.map(function (l, i) { return palette[i % palette.length]; });
  if (AppState.charts[chartKey]) AppState.charts[chartKey].destroy();
  AppState.charts[chartKey] = new Chart(canvas.getContext('2d'), {
    type: 'doughnut',
    // Kullanıcı talebi: pasta grafiklerde dilimin üstünde her zaman yüzde
    // görünsün — yalnız bu chart'a (global registrasyon yok) datalabels
    // plugin'i eklendi, bar/çizgi grafikleri etkilenmiyor.
    plugins: (window.ChartDataLabels ? [window.ChartDataLabels] : []),
    data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 2, borderColor: cssVar('--card-bg') }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right', labels: { color: cssVar('--text'), boxWidth: 12, font: { size: 10 } } },
        datalabels: {
          color: '#fff', font: { weight: '700', size: 11 },
          formatter: function (value) { return total ? Math.round(value / total * 100) + '%' : ''; }
        }
      },
      onClick: function (evt, els) {
        if (!els.length) return;
        applyChartClickFilter(labels[els[0].index]);
      }
    }
  });
}

function drawBarChart(canvasId, chartKey, dataObj, colorIndex) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var wrap = canvas.closest('.chart-canvas-wrap');
  // Kullanıcı talebi: kategoriler her zaman büyükten küçüğe sıralı gösterilsin.
  var entries = Object.keys(dataObj || {}).map(function (k) { return [k, dataObj[k]]; });
  entries.sort(function (a, b) { return b[1] - a[1]; });
  if (!entries.length) { showChartNoData(wrap, canvas); return; }
  showCanvas(wrap, canvas);
  var labels = entries.map(function (e) { return e[0]; });
  var values = entries.map(function (e) { return e[1]; });
  if (AppState.charts[chartKey]) AppState.charts[chartKey].destroy();
  AppState.charts[chartKey] = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: { labels: labels, datasets: [{ data: values, backgroundColor: chartPalette()[colorIndex] }] },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: cssVar('--muted'), font: { size: 9 } }, grid: { color: 'rgba(148,163,184,0.15)' } },
        y: { ticks: { color: cssVar('--muted'), font: { size: 9 } }, grid: { display: false } }
      },
      onClick: function (evt, els) {
        if (!els.length) return;
        applyChartClickFilter(labels[els[0].index]);
      }
    }
  });
}

function drawProductChart(productVolume) { drawBarChart('chart-product', 'product', productVolume, 0); }
function drawVolByTypeChart(volByType) { drawBarChart('chart-volbytype', 'volbytype', volByType, 0); }

// "Order Intake by Project Type" — kullanıcı bulgusu: bir kategorinin
// (ör. çoktan Launched olmuş bir Project Type) OI'si diğerlerinden çok
// büyük olunca yanal (değer) ekseni tek o kategoriye göre ölçekleniyor,
// geri kalan kategoriler görünmez ince çizgilere dönüşüyordu. Çözüm:
// logaritmik x ekseni (en büyük değeri "kısaltır", küçük değerleri de
// görünür kılar) + her çubuğun ucunda gerçek değeri yazan bir etiket
// (ölçek sıkıştırılsa da veri normalde okunabilir kalsın — kullanıcı
// talebi). Coverage + burada değil, KPI şeridinde ayrı bir kart olarak
// gösteriliyor (kullanıcı talebi: "grafiğin içerisinde gösterme").
function drawOiByTypeChart(oiByType) {
  var canvas = document.getElementById('chart-oibytype');
  if (!canvas) return;
  var wrap = canvas.closest('.chart-canvas-wrap');
  var entries = Object.keys(oiByType || {}).map(function (k) { return [k, oiByType[k]]; });
  entries.sort(function (a, b) { return b[1] - a[1]; });
  if (!entries.length) { showChartNoData(wrap, canvas); return; }
  showCanvas(wrap, canvas);
  var labels = entries.map(function (e) { return e[0]; });
  var values = entries.map(function (e) { return e[1]; });
  // Logaritmik eksen 0'ı çizemez — gerçek değer 0 olan bir kategori varsa
  // yalnız ÇİZİM için küçük bir taban değere yuvarlanır, etikette (aşağıda
  // `values[ctx.dataIndex]` ile) gerçek değer (0) yazılmaya devam eder.
  var plotValues = values.map(function (v) { return v > 0 ? v : 0.01; });

  if (AppState.charts.oibytype) AppState.charts.oibytype.destroy();
  AppState.charts.oibytype = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    plugins: (window.ChartDataLabels ? [window.ChartDataLabels] : []),
    data: { labels: labels, datasets: [{
      data: plotValues, backgroundColor: chartPalette()[1],
      datalabels: {
        color: cssVar('--muted'), anchor: 'end', align: 'right', font: { size: 9 },
        formatter: function (v, ctx) { return fmtNum(values[ctx.dataIndex]); }
      }
    }] },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function (ctx) { return fmtNum(values[ctx.dataIndex]); } } }
      },
      scales: {
        x: { type: 'logarithmic', ticks: { color: cssVar('--muted'), font: { size: 9 }, callback: function (v) { return fmtNum(v); } }, grid: { color: 'rgba(148,163,184,0.15)' } },
        y: { ticks: { color: cssVar('--muted'), font: { size: 9 } }, grid: { display: false } }
      },
      onClick: function (evt, els) {
        if (!els.length) return;
        applyChartClickFilter(labels[els[0].index]);
      }
    }
  });
}

// Çeyreklik kümülatif OI çizgisi — Plan (K kolonu) ile Actual (X kolonu,
// kullanıcı talebi) iki ayrı çizgi olarak gösteriliyor: Plan kesikli/soluk,
// Actual dolu/vurgulu — aradaki fark hem görsel olarak hem de üstteki
// başlıkta (Δ) okunabiliyor. compact=true iken (varsayılan, sade görünüm
// için) eksenler/legend gizlenir, yalnız iki renkli çizgi kalır; büyüt
// düğmesine basılınca (compact=false) tam detay açılır.
function drawQuarterlyChart(qData, compact) {
  var canvas = document.getElementById('chart-quarterly');
  if (!canvas) return;
  var wrap = canvas.closest('.chart-canvas-wrap');
  // Kullanıcı talebi: henüz gerçekleşmemiş (gelecek) çeyrekler grafikten
  // tamamen çıkarılır — "Q4'te planlanan projeler henüz gerçekleşmediği
  // için data yanıltıyor" — Plan çizgisi de dahil, yalnız bugüne kadar
  // geçen çeyrekler çizilir.
  var vq = (qData.visibleQuarters != null) ? qData.visibleQuarters : 4;
  if (vq <= 0) { showChartNoData(wrap, canvas); return; }
  showCanvas(wrap, canvas);
  if (AppState.charts.quarterly) AppState.charts.quarterly.destroy();
  var palette = chartPalette();
  var plannedColor = cssVar('--muted') || '#94a3b8';
  var actualColor = palette[0];
  AppState.charts.quarterly = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: ['Q1', 'Q2', 'Q3', 'Q4'].slice(0, vq),

        {
          label: t('oiPlannedLabel'), data: qData.plannedCumulative.slice(0, vq),
          borderColor: plannedColor, backgroundColor: plannedColor, borderDash: [6, 4],
          pointRadius: 3, pointHoverRadius: 5, borderWidth: 2, tension: 0.25, fill: false
        },
        {
          label: t('oiActualLabel'), data: qData.actualCumulative.slice(0, vq),
          borderColor: actualColor, backgroundColor: actualColor,
          pointRadius: 4, pointHoverRadius: 6, borderWidth: 2.5, tension: 0.25, fill: false
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: !compact, position: 'top', labels: { color: cssVar('--text'), boxWidth: 10, font: { size: 10 } } },
        tooltip: { callbacks: { label: function (ctx) { return ctx.dataset.label + ': ' + fmtEur(ctx.parsed.y); } } }
      },
      scales: {
        x: { display: !compact, ticks: { color: cssVar('--muted'), font: { size: 11 } }, grid: { display: false } },
        y: { display: !compact, beginAtZero: true, ticks: { color: cssVar('--muted'), font: { size: 10 }, callback: function (v) { return fmtNum(v); } }, grid: { color: 'rgba(148,163,184,0.15)' } }
      }
    }
  });
}

function showChartNoData(wrap, canvas) {
  canvas.style.display = 'none';
  var msg = wrap.querySelector('.chart-no-data');
  if (!msg) { msg = document.createElement('div'); msg.className = 'chart-no-data'; wrap.appendChild(msg); }
  msg.textContent = t('listEmptySub');
}
function showCanvas(wrap, canvas) {
  canvas.style.display = 'block';
  var msg = wrap.querySelector('.chart-no-data');
  if (msg) msg.remove();
}
// body.dark-mode sınıfı BODY üzerinde tanımlı — document.documentElement
// (<html>) bu override'ı miras ALMAZ (özel property'ler DOM ağacında
// aşağı doğru kaskad olur, body'deki bir override yukarı <html>'e sızmaz).
// Önceki sürüm önce documentElement'i okuyordu; bu her zaman AÇIK TEMA
// değerini döndürüyordu (boş string değil, bu yüzden || yedeği hiç
// devreye girmiyordu) — koyu modda grafik yazıları soluk/yanlış renkte
// kalıyordu. Düzeltme: her zaman BODY'den oku.
function cssVar(name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); }
function refreshChartsForTheme() {
  var agg = AppState.dashboard.agg;
  if (!agg) return;
  if (AppState.charts.plant) drawPieChart('chart-plant', 'plant', agg.plantCounts);
  if (AppState.charts.volbytype) drawVolByTypeChart(agg.volByType);
  if (AppState.charts.oibytype) drawOiByTypeChart(agg.oiByType);
  if (AppState.charts.product) drawProductChart(agg.productVolume);
  if (AppState.charts.quarterly) drawQuarterlyChart(AppState.dashboard.qData, !AppState.dashboard.oiExpanded);
}

// --------------------------------------------------------------------------
// Parça Listesi — filtre/sıralama katmanı (ColFilter-lite, veri-listeleme.md)
// 1000 satırın altındaki bu ölçekte parçalı çizim (chunked render) bilerek
// atlandı — mvp-akisi.md'nin orantılı mühendislik ilkesi.
// --------------------------------------------------------------------------

var VISIBLE_COLS = ['plant', 'pn', 'product', 'volume', 'oi', 'status', 'statusPlanned', 'projectStatus'];
var FILTERABLE = ['plant', 'product', 'statusCategory', 'projectStatus'];
// Filtre başlıkları için anahtar -> çeviri-anahtarı eşlemesi (renderFilterBar).
var FILTER_LABEL_KEYS = { plant: 'filterPlant', product: 'filterProduct', statusCategory: 'filterStatus', projectStatus: 'filterProjectStatus' };

function loadListe(force) {
  var root = document.getElementById('liste-body');
  root.innerHTML = '<div class="loading-overlay"><span class="spinner"></span>' + t('loading') + '</div>';
  ensureRowsLoaded(force, function (err) {
    if (err) {
      root.innerHTML = '<div class="chart-error">' + icon('alertTriangle', 22) + '<div>' + t('loadError') + '</div>' +
        '<button class="btn btn-outlined" onclick="loadListe(true)">' + icon('refreshCw', 14) + ' ' + t('retry') + '</button></div>';
      return;
    }
    renderListe();
  });
}

function applyListeFilters() {
  var rows = AppState.liste.rows || [];
  var f = AppState.liste.filters;
  var terms = parseSearchTerms(AppState.liste.search);
  var out = rows.filter(function (r) {
    for (var key in f) {
      if (f[key] && f[key].length && f[key].indexOf(String(r[key])) === -1) return false;
    }
    if (!rowMatchesTerms(r, terms)) return false;
    return true;
  });
  var s = AppState.liste.sort;
  if (s.key) {
    out.sort(function (a, b) {
      var av = a[s.key], bv = b[s.key];
      var an = parseFloat(av), bn = parseFloat(bv);
      var cmp = (!isNaN(an) && !isNaN(bn)) ? (an - bn) : String(av || '').localeCompare(String(bv || ''));
      return cmp * s.dir;
    });
  }
  return out;
}

// Türkçe karakter-duyarsız normalize (dil-yerellestirme.md)
function _norm(s) {
  return String(s == null ? '' : s)
    .replace(/[ıİ]/g, 'i').replace(/[şŞ]/g, 's').replace(/[ğĞ]/g, 'g')
    .replace(/[üÜ]/g, 'u').replace(/[öÖ]/g, 'o').replace(/[çÇ]/g, 'c')
    .toLowerCase();
}

function renderListe() {
  var root = document.getElementById('liste-body');
  if (!AppState.liste.rows) return;
  var filtered = applyListeFilters();

  var html = renderFilterBar();
  html += renderActiveChips();

  if (!filtered.length) {
    html += emptyStateHtml('search', t('listEmptyTitle'), t('listEmptySub'),
      '<button class="btn btn-outlined" onclick="clearListeFilters()">' + t('clearFilters') + '</button>');
  } else {
    html += '<div class="tbl-wrap"><table class="dt m-cards" id="liste-table"><thead><tr>';
    VISIBLE_COLS.forEach(function (key) {
      var numeric = (key === 'volume' || key === 'oi');
      var label = colLabel(key);
      var sortIndicator = (AppState.liste.sort.key === key) ? (AppState.liste.sort.dir === 1 ? icon('chevronDown', 11) : icon('chevronUp', 11)) : '';
      html += '<th class="sortable' + (numeric ? ' cf-num' : '') + '" data-sort="' + key + '">' + label + ' <span class="sort-arrow">' + sortIndicator + '</span></th>';
    });
    html += '</tr></thead><tbody>';
    filtered.forEach(function (r) {
      html += '<tr>';
      VISIBLE_COLS.forEach(function (key) {
        var numeric = (key === 'volume' || key === 'oi');
        var label = colLabel(key);
        var cell;
        if (key === 'pn') {
          cell = '<button class="pn-link" data-open-pn="' + escAttr(r.pn) + '">' + escHtml(r.pn) + '</button>' +
            (r.riskLevel !== 'ontrack' ? '<span class="risk-flag" title="' + (r.riskLevel === 'risk' ? t('statusRisk') : t('statusDelay')) + '">' + icon('alertTriangle', 14) + '</span>' : '') +
            (r.comment ? '<span class="comment-flag" title="' + escAttr(r.comment) + '">' + icon('messageSquare', 14) + '</span>' : '');
        } else if (key === 'status') {
          cell = riskChip(r.riskLevel, r.statusCategory === 'Launched');
        } else if (key === 'statusPlanned') {
          cell = escHtml(lexLabel(r.statusPlanned));
        } else if (numeric) {
          cell = fmtNum(r[key]);
        } else {
          cell = escHtml(r[key]);
        }
        html += '<td class="' + (numeric ? 'cf-num' : '') + '" data-label="' + escAttr(label) + '">' + cell + '</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  }

  root.innerHTML = html;
  wireListeInteractions(filtered);
}

// Kullanıcı talebi (2026-09-01): kolon başlıkları, biz hardcode ettiğimiz
// jenerik metin yerine — varsa — Sheet'in 1. satırındaki GERÇEK başlığı
// kullanır (getParcaListesi()'nin döndürdüğü columns[].sheetLabel, bkz.
// Code.gs _columnsWithHeaders_). Böylece kullanıcı Sheet'te "Coverage + (%)"
// gibi bir birim yazarsa, biz onu uydurmadan/varsaymadan aynen yansıtırız.
function sheetLabelFor(key, fallbackTKey) {
  var cols = AppState.liste.columns || [];
  for (var i = 0; i < cols.length; i++) {
    if (cols[i].key === key && cols[i].sheetLabel) return cols[i].sheetLabel;
  }
  return fallbackTKey ? t(fallbackTKey) : key;
}
// Başlıkta parantez içinde bir birim varsa (ör. "Coverage + (%)" -> "%")
// onu ayıklar — KPI kartları gibi başlığın tamamının sığmadığı yerlerde
// yalnız birimi eklemek için kullanılır. Yoksa boş string döner (birim
// uydurulmaz).
function unitFor(key) {
  var label = sheetLabelFor(key, null);
  var m = /\(([^)]+)\)/.exec(label || '');
  return m ? m[1] : '';
}

function colLabel(key) {
  var fallbackMap = { plant: 'colPlant', pn: 'colPn', product: 'colProduct', projectType: 'colProjectType', volume: 'colVolume', oi: 'colOi', status: 'colStatus', statusPlanned: 'colPlanned', launchSheet: 'colLaunch', projectStatus: 'colProjectStatus' };
  if (key === 'status') return t('colStatus'); // risk rozeti — türetilmiş, gerçek bir Sheet kolonu değil
  return sheetLabelFor(key, fallbackMap[key] || key);
}

function renderFilterBar() {
  var html = '<div class="filter-bar">';
  FILTERABLE.forEach(function (key) {
    var labelKey = FILTER_LABEL_KEYS[key] || 'filterStatus';
    var active = AppState.liste.filters[key] && AppState.liste.filters[key].length;
    html += '<div class="filter-group"><span class="filter-label">' + t(labelKey) + '</span>' +
      '<div class="fdr-wrap"><button class="fdr-btn' + (active ? ' fdr-active' : '') + '" data-fdr="' + key + '">' +
      icon('filter', 14) + t(labelKey) + (active ? ' (' + AppState.liste.filters[key].length + ')' : '') + '</button>' +
      '<div class="fdr-drop" id="fdr-' + key + '"></div></div></div>';
  });
  html += '<div class="filter-group filter-search"><span class="filter-label">' + icon('search', 12) + '</span>' +
    '<input class="fdr-search" id="liste-search" type="search" placeholder="' + t('searchPlaceholder') + '" value="' + escAttr(AppState.liste.search) + '" aria-label="' + t('searchPlaceholder') + '"></div>';
  html += '</div>';
  return html;
}

function renderActiveChips() {
  var f = AppState.liste.filters;
  var chips = [];
  Object.keys(f).forEach(function (key) {
    (f[key] || []).forEach(function (v) {
      chips.push({ key: key, val: v });
    });
  });
  if (!chips.length) return '';
  var html = '<div class="active-filters">';
  chips.forEach(function (c) {
    html += '<span class="filter-chip">' + escHtml(c.val) +
      '<button class="filter-chip-remove" data-chip-key="' + c.key + '" data-chip-val="' + escAttr(c.val) + '" aria-label="' + t('clearFilters') + '">' + icon('x', 11) + '</button></span>';
  });
  html += '<button class="btn btn-text" style="font-size:var(--fs-xs);padding:2px 6px;" onclick="clearListeFilters()">' + t('clearFilters') + '</button>';
  html += '</div>';
  return html;
}

function clearListeFilters() {
  AppState.liste.filters = {};
  AppState.liste.search = '';
  renderListe();
}

function wireListeInteractions(filteredRows) {
  document.querySelectorAll('[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var key = th.getAttribute('data-sort');
      var s = AppState.liste.sort;
      s.dir = (s.key === key) ? -s.dir : 1;
      s.key = key;
      renderListe();
    });
  });
  document.querySelectorAll('[data-open-pn]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      openDrawer(btn.getAttribute('data-open-pn'), filteredRows.map(function (r) { return r.pn; }));
    });
  });
  document.querySelectorAll('[data-chip-key]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var key = btn.getAttribute('data-chip-key'), val = btn.getAttribute('data-chip-val');
      var arr = AppState.liste.filters[key] || [];
      AppState.liste.filters[key] = arr.filter(function (v) { return v !== val; });
      renderListe();
    });
  });
  document.querySelectorAll('[data-fdr]').forEach(function (btn) {
    btn.addEventListener('click', function (ev) {
      ev.stopPropagation();
      toggleFilterDrop(btn.getAttribute('data-fdr'), btn);
    });
  });
  var search = document.getElementById('liste-search');
  if (search) {
    search.addEventListener('input', function () {
      AppState.liste.search = search.value;
      var pos = search.selectionStart;
      renderListe();
      var again = document.getElementById('liste-search');
      if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    });
  }
}

function toggleFilterDrop(key, btnEl) {
  var isOpen = btnEl.classList.contains('fdr-active-open');
  closeAllFilterDrops();
  if (isOpen) return;
  var drop = document.getElementById('fdr-' + key);
  var rect = btnEl.getBoundingClientRect();
  drop.style.left = rect.left + 'px';
  drop.style.top = (rect.bottom + 4) + 'px';
  drop.innerHTML = renderFilterDropList(key);
  drop.classList.add('fdr-open');
  btnEl.classList.add('fdr-active-open');
  wireFilterDropList(key, drop);
}

function closeAllFilterDrops() {
  document.querySelectorAll('.fdr-drop').forEach(function (d) { d.classList.remove('fdr-open'); });
  document.querySelectorAll('.fdr-btn').forEach(function (b) { b.classList.remove('fdr-active-open'); });
}

function uniqueValuesFor(key) {
  var rows = AppState.liste.rows || [];
  var seen = {}; var out = [];
  rows.forEach(function (r) {
    var v = String(r[key] == null ? '' : r[key]);
    if (v && !seen[v]) { seen[v] = true; out.push(v); }
  });
  out.sort();
  return out;
}

function renderFilterDropList(key) {
  var values = uniqueValuesFor(key);
  var selected = AppState.liste.filters[key] || [];
  var isStatusCat = (key === 'statusCategory');
  var html = '<div class="fdr-searchwrap"><input class="fdr-search" type="search" placeholder="' + t('searchPlaceholder') + '" data-fdr-search="' + key + '"></div><div class="fdr-list">';
  values.forEach(function (v) {
    var label = isStatusCat ? (v === 'Launched' ? t('statusLaunched') : v === 'Planned' ? t('statusPlanned') : v === 'Delayed' ? t('statusDelay') : t('statusRisk')) : v;
    var id = 'fdr-' + key + '-' + btoa(unescape(encodeURIComponent(v))).replace(/[^a-zA-Z0-9]/g, '');
    html += '<label class="fdr-item" data-fdr-row="' + escAttr(v.toLowerCase()) + '"><input type="checkbox" id="' + id + '" value="' + escAttr(v) + '"' + (selected.indexOf(v) > -1 ? ' checked' : '') + '> ' + escHtml(label) + '</label>';
  });
  html += '</div>';
  return html;
}

function wireFilterDropList(key, drop) {
  drop.querySelectorAll('input[type=checkbox]').forEach(function (cb) {
    cb.addEventListener('change', function () {
      var arr = AppState.liste.filters[key] || [];
      if (cb.checked) arr.push(cb.value); else arr = arr.filter(function (v) { return v !== cb.value; });
      AppState.liste.filters[key] = arr;
      renderListe();
      // Yeniden çizimden sonra aynı panel açık kalsın.
      var btn = document.querySelector('[data-fdr="' + key + '"]');
      if (btn) toggleFilterDrop(key, btn);
    });
  });
  var searchInput = drop.querySelector('[data-fdr-search]');
  if (searchInput) {
    searchInput.addEventListener('input', function () {
      var q = _norm(searchInput.value);
      drop.querySelectorAll('[data-fdr-row]').forEach(function (row) {
        row.style.display = _norm(row.getAttribute('data-fdr-row')).indexOf(q) > -1 ? '' : 'none';
      });
    });
  }
}

// --------------------------------------------------------------------------
// Detay Paneli (Drawer) — detay-panel.md
// --------------------------------------------------------------------------

function openDrawer(pn, listPns) {
  AppState.drawer.open = true;
  AppState.drawer.pn = pn;
  AppState.drawer.listPns = listPns || [];
  document.getElementById('drawer-scrim').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  loadDrawerRecord(pn);
}

function closeDrawer() {
  AppState.drawer.open = false;
  document.getElementById('drawer-scrim').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function loadDrawerRecord(pn) {
  var body = document.getElementById('drawer-body');
  body.innerHTML = '<div class="loading-overlay"><span class="spinner"></span>' + t('loading') + '</div>';
  gsCall('getParcaDetay', [pn], function (data) {
    AppState.drawer.record = data.record;
    AppState.drawer.columns = data.columns;
    AppState.drawer.milestoneKeys = data.milestoneKeys;
    AppState.drawer.suggestions = data.milestoneSuggestions;
    renderDrawer();
  }, function (err) {
    body.innerHTML = '<div class="chart-error">' + icon('alertTriangle', 22) + '<div>' + t('loadError') + '</div>' +
      '<button class="btn btn-outlined" onclick="loadDrawerRecord(\'' + pn.replace(/'/g, "\\'") + '\')">' + icon('refreshCw', 14) + ' ' + t('retry') + '</button></div>';
  });
}

function drawerColByKey(key) {
  var cols = AppState.drawer.columns || [];
  for (var i = 0; i < cols.length; i++) if (cols[i].key === key) return cols[i];
  return null;
}

function renderDrawer() {
  var rec = AppState.drawer.record;
  if (!rec) return;
  document.getElementById('drawer-hd-title').textContent = t('drawerTitle') + ' — ' + rec.pn;

  // Önceki/sonraki gezinme — panel açıldığı listenin bir üyesiyse.
  var pos = AppState.drawer.listPns.indexOf(rec.pn);
  var navHtml;
  if (pos < 0) {
    navHtml = '<span class="drawer-nav-pos">' + t('drawerOpenedElsewhere') + '</span>';
  } else {
    navHtml =
      '<button data-step="-1" ' + (pos <= 0 ? 'disabled' : '') + ' aria-label="' + t('prev') + '">' + icon('chevronUp', 16) + '</button>' +
      '<span class="drawer-nav-pos">' + (pos + 1) + ' / ' + AppState.drawer.listPns.length + '</span>' +
      '<button data-step="1" ' + (pos >= AppState.drawer.listPns.length - 1 ? 'disabled' : '') + ' aria-label="' + t('next') + '">' + icon('chevronDown', 16) + '</button>';
  }
  document.getElementById('drawer-nav').innerHTML = navHtml;
  document.querySelectorAll('#drawer-nav [data-step]').forEach(function (b) {
    b.addEventListener('click', function () {
      var newPos = pos + parseInt(b.getAttribute('data-step'), 10);
      var newPn = AppState.drawer.listPns[newPos];
      if (newPn) { AppState.drawer.pn = newPn; loadDrawerRecord(newPn); }
    });
  });

  var body = document.getElementById('drawer-body');
  var html = '';

  if (rec.riskLevel === 'risk' || rec.riskLevel === 'gecikme') {
    html += '<div class="risk-banner ' + (rec.riskLevel === 'risk' ? 'st-err' : 'st-warn') + '" style="background:' +
      (rec.riskLevel === 'risk' ? 'var(--st-err-bg)' : 'var(--st-warn-bg)') + ';color:' +
      (rec.riskLevel === 'risk' ? 'var(--st-err-fg)' : 'var(--st-warn-fg)') + ';">' +
      icon('alertTriangle', 16) + (rec.riskLevel === 'risk' ? t('riskBannerRisk') : t('riskBannerDelay')) + '</div>';
  }

  html += '<div class="drawer-sec">' + t('drawerSecIdentity') + '</div>';
  html += propRow('plant', 'dashboard') + propRow('projectType', 'list') + propRow('diameter', 'list') + propRow('pn', 'search') + propRow('product', 'list');

  html += '<div class="drawer-sec">' + t('drawerSecCommercial') + '</div>';
  html += propRow('pnCompetitor', 'edit') + propRow('attrPPCA', 'edit') + propRow('attrDisc', 'edit') + propRow('attrRB', 'edit') +
    propRow('volume', 'edit') + propRow('oi', 'edit') + propRow('oiActual', 'edit') + propRow('coveragePlus', 'edit') + propRow('eur', 'edit') +
    propRow('projectStatus', 'edit') + propRow('statusPlanned', 'edit') + propRow('statusActual', 'checkCircle');

  html += '<div class="drawer-sec">' + t('drawerSecMilestones') + '</div>';
  html += '<div class="milestone-list">';
  (AppState.drawer.milestoneKeys || []).forEach(function (key) { html += propRow(key, 'checkCircle'); });
  html += '</div>';

  // Z kolonu (kullanıcı talebi): serbest metin proje yorumu — kendi
  // bölümünde, tam genişlikte (bkz. propRow'daki 'textarea' tipi).
  html += '<div class="drawer-sec">' + t('drawerSecComment') + '</div>';
  html += propRow('comment', 'messageSquare');

  body.innerHTML = html;
  wireDrawerEdits();
}

function fieldLabelKey(key) {
  var map = {
    plant: 'fieldPlant', projectType: 'fieldProjectType', diameter: 'fieldDiameter', pn: 'fieldPn',
    pnCompetitor: 'fieldPnCompetitor', product: 'fieldProduct',
    attrPPCA: 'fieldAttrPPCA', attrDisc: 'fieldAttrDisc', attrRB: 'fieldAttrRB',
    volume: 'fieldVolume', oi: 'fieldOi', oiActual: 'fieldOiActual', coveragePlus: 'fieldCoveragePlus', eur: 'fieldEur',
    projectStatus: 'fieldProjectStatus', comment: 'fieldComment',
    statusPlanned: 'fieldStatusPlanned', statusActual: 'fieldStatusActual',
    msSamplePurchase: 'msSamplePurchase', msCompetitorAnalysis: 'msCompetitorAnalysis',
    msProductDefinition: 'msProductDefinition', msCommercialAgreement: 'msCommercialAgreement',
    msSampleProduction: 'msSampleProduction', msBenchTesting: 'msBenchTesting', msVehicleTest: 'msVehicleTest',
    msCRD: 'msCRD', launchSheet: 'launchSheet'
  };
  return sheetLabelFor(key, map[key] || key);
}

function propRow(key, iconName) {
  var rec = AppState.drawer.record;
  var col = drawerColByKey(key);
  var label = fieldLabelKey(key);
  var raw = rec[key];
  var isTextarea = col && col.type === 'textarea';
  var displayVal;
  if (col && col.type === 'date') displayVal = fmtDate(raw);
  else if (col && col.type === 'number') displayVal = (raw === '' || raw == null) ? '—' : fmtNum(raw);
  else if (col && col.type === 'combo') displayVal = lexLabel(raw) || '—';
  else if (isTextarea) displayVal = (raw === '' || raw == null) ? '<span class="prop-empty-hint">' + t('noComment') + '</span>' : escHtml(raw);
  else displayVal = (raw === '' || raw == null) ? '—' : escHtml(raw);

  var editable = col && col.editable;
  var valueHtml;
  if (editable) {
    valueHtml = '<button class="prop-btn' + (isTextarea ? ' prop-btn-block' : '') + '" data-prop="' + key + '">' +
      '<span class="' + (isTextarea ? 'comment-text' : '') + '">' + displayVal + '</span>' +
      '<span class="edit-icon">' + icon('edit', 14) + '</span></button>';
  } else {
    valueHtml = '<div class="prop-static">' + displayVal + '</div>';
  }

  return '<div class="prop-row' + (isTextarea ? ' prop-row-block' : '') + '" data-prop-row="' + key + '">' +
    '<span class="prop-icon">' + icon(iconName, 18) + '</span>' +
    '<label class="prop-label" for="propctl-' + key + '">' + label + '</label>' +
    '<span class="prop-value-wrap">' + valueHtml + '</span></div>';
}

function wireDrawerEdits() {
  document.querySelectorAll('[data-prop]').forEach(function (btn) {
    btn.addEventListener('click', function () { activateEdit(btn.getAttribute('data-prop')); });
    btn.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); activateEdit(btn.getAttribute('data-prop')); }
    });
  });
}

function activateEdit(key) {
  var row = document.querySelector('[data-prop-row="' + key + '"]');
  var col = drawerColByKey(key);
  var rec = AppState.drawer.record;
  var wrap = row.querySelector('.prop-value-wrap');
  var raw = rec[key];
  var inputHtml;
  var inputType = 'text';
  if (col.type === 'number') inputType = 'number';
  if (col.type === 'date') inputType = 'date';

  if (col.type === 'combo') {
    var listId = 'dl-' + key;
    var opts = (AppState.drawer.suggestions || []).map(function (s) { return '<option value="' + escAttr(s) + '">'; }).join('');
    inputHtml = '<input class="prop-input" id="propctl-' + key + '" list="' + listId + '" value="' + escAttr(raw || '') + '" data-autofocus>' +
      '<datalist id="' + listId + '">' + opts + '</datalist>';
  } else if (col.type === 'date') {
    var dv = raw ? new Date(raw) : null;
    var iso = (dv && !isNaN(dv.getTime())) ? dv.toISOString().slice(0, 10) : '';
    inputHtml = '<input class="prop-input" id="propctl-' + key + '" type="date" value="' + iso + '" data-autofocus>';
  } else if (col.type === 'textarea') {
    // Serbest metin yorum (kullanıcı talebi, Z kolonu) — çok satırlı
    // olabilir, bu yüzden Enter burada kaydetmiyor (aşağıdaki keydown),
    // yalnız blur veya Ctrl/Cmd+Enter kaydeder.
    inputHtml = '<textarea class="prop-input prop-textarea" id="propctl-' + key + '" placeholder="' + escAttr(t('commentPlaceholder')) + '" data-autofocus>' + escHtml(raw == null ? '' : raw) + '</textarea>';
  } else {
    inputHtml = '<input class="prop-input" id="propctl-' + key + '" type="' + inputType + '" value="' + escAttr(raw == null ? '' : raw) + '" data-autofocus>';
  }

  wrap.innerHTML = inputHtml;
  var input = wrap.querySelector('[data-autofocus]');
  input.focus();
  if (input.select) input.select();

  var commit = function () { saveField(key, input.value); };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && col.type === 'textarea' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); input.blur(); }
    else if (ev.key === 'Enter' && col.type !== 'textarea') { ev.preventDefault(); input.blur(); }
    if (ev.key === 'Escape') { ev.preventDefault(); input.removeEventListener('blur', commit); renderDrawer(); }
  });
}

function saveField(key, newValue) {
  var rec = AppState.drawer.record;
  var col = drawerColByKey(key);
  var oldValue = rec[key];
  // Tarih alanında sunucu ISO datetime tutar, input ise YYYY-MM-DD döner —
  // yalnız gün kısmını karşılaştır, yoksa değişmeyen bir tarih bile "kaydedildi"
  // gösterir (madde 2: gerçekte olmayan bir değişikliği bildirmek yanlış-güven).
  var unchanged = (col && col.type === 'date')
    ? (String(oldValue || '').slice(0, 10) === String(newValue || ''))
    : (String(oldValue == null ? '' : oldValue) === String(newValue == null ? '' : newValue));
  if (unchanged) { renderDrawer(); return; }

  saveStart();
  gsCall('updateParcaField', [rec.pn, key, newValue], function (res) {
    rec[key] = res.newValue;
    if (AppState.liste.rows) {
      var row = AppState.liste.rows.find(function (r) { return r.pn === rec.pn; });
      if (row) row[key] = res.newValue;
    }
    saveEnd(true);
    renderDrawer();
    // Panelin arkasındaki sayfa (Dashboard'un KPI/grafikleri veya Liste'nin
    // tablosu) düzenlenen satırı zaten güncellenmiş önbellekten okuyacak —
    // yalnız az önce yazdık diye "kaydedildi" gösterip arka planı bayat
    // bırakmamak için burada da yeniden çiziyoruz.
    renderDashboard();
    renderListe();
    var label = fieldLabelKey(key);
    toastUndo(t('saved') + ': ' + label, function () {
      gsCall('updateParcaField', [rec.pn, key, res.oldValue], function (undoRes) {
        rec[key] = undoRes.newValue;
        if (AppState.liste.rows) {
          var row2 = AppState.liste.rows.find(function (r) { return r.pn === rec.pn; });
          if (row2) row2[key] = undoRes.newValue;
        }
        renderDrawer();
        renderDashboard();
        renderListe();
        showToast(t('undoDone'), 'success');
      }, function () { showToast(t('undoFailed'), 'error'); });
    });
  }, function (err) {
    saveEnd(false);
    showToast(t('saveError') + ': ' + err, 'error');
    renderDrawer();
  });
}

// --------------------------------------------------------------------------
// Savebar — bilesenler.md "Kayıt Göstergesi"
// --------------------------------------------------------------------------

var _saveN = 0, _saveErr = false, _saveHideT = null;
function saveStart() {
  if (_saveN === 0) _saveErr = false;
  _saveN++;
  clearTimeout(_saveHideT);
  _paintSave('saving');
}
function saveEnd(ok) {
  if (!ok) _saveErr = true;
  _saveN = Math.max(0, _saveN - 1);
  if (_saveN > 0) return;
  _paintSave(_saveErr ? 'error' : 'saved');
  _saveHideT = setTimeout(function () { document.getElementById('savebar').classList.remove('show'); }, _saveErr ? 2800 : 1500);
}
function _paintSave(state) {
  var bar = document.getElementById('savebar');
  bar.classList.toggle('err', state === 'error');
  bar.classList.add('show');
  bar.setAttribute('role', 'status');
  bar.setAttribute('aria-live', 'polite');
  if (state === 'saving') bar.innerHTML = '<span class="spinner" style="width:14px;height:14px;"></span>' + t('saving');
  else if (state === 'saved') bar.innerHTML = icon('checkCircle', 15) + t('saved');
  else bar.innerHTML = icon('xCircle', 15) + t('saveError');
}

// --------------------------------------------------------------------------
// Toast + Undo — bilesenler.md
// --------------------------------------------------------------------------

function showToast(msg, type) {
  var wrap = document.getElementById('toast-wrap');
  var el = document.createElement('div');
  el.className = 'toast toast-' + (type || 'info');
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.setAttribute('aria-live', type === 'error' ? 'assertive' : 'polite');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(function () { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 300); }, 2700);
}

var UNDO_MS = 5000, _undoToast = null;
function toastUndo(msg, undoFn) {
  if (_undoToast) _undoToast.remove();
  var wrap = document.getElementById('toast-wrap');
  var el = document.createElement('div');
  el.className = 'toast toast-success';
  el.setAttribute('role', 'status');
  el.setAttribute('aria-live', 'polite');
  el.innerHTML = '<span>' + escHtml(msg) + '</span>';
  var btn = document.createElement('button');
  btn.className = 'toast-undo';
  btn.innerHTML = icon('undo', 13) + t('undo');
  var used = false;
  btn.addEventListener('click', function () {
    if (used) return; used = true;
    if (_undoToast === el) _undoToast = null;
    el.remove();
    try { undoFn(); } catch (e) { showToast(t('undoFailed'), 'error'); }
  });
  el.appendChild(btn);
  wrap.appendChild(el);
  _undoToast = el;
  setTimeout(function () { if (_undoToast === el) _undoToast = null; if (el.parentNode) el.remove(); }, UNDO_MS);
}

// --------------------------------------------------------------------------
// Yardımcılar
// --------------------------------------------------------------------------

function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function escAttr(s) { return escHtml(s); }
</script>
